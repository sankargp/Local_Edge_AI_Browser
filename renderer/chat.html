<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat — Local AI Browser</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0c1016;
      color: #e8edf4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 50% -20%, #1b2a40, #0c1016 55%); }
    .shell { width: min(980px, 100%); min-height: calc(100vh - 48px); margin: 0 auto; padding: 28px 20px 48px; display: flex; flex-direction: column; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 28px; }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 12px; background: linear-gradient(135deg, #4384ff, #7755e8); font-size: 19px; box-shadow: 0 8px 24px #080b1470; }
    h1 { margin: 0; font-size: 18px; letter-spacing: -.01em; }
    .subtitle { margin: 3px 0 0; color: #8d9caf; font-size: 12px; }
    #status { display: flex; align-items: center; gap: 8px; color: #9aa9bb; font-size: 12px; text-align: right; }
    #status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #8895a5; }
    #status.ready::before { background: #47d18c; box-shadow: 0 0 10px #47d18c; }
    #status.error::before { background: #ff7082; }
    #messages { flex: 1; display: flex; flex-direction: column; gap: 18px; padding: 10px 0 22px; overflow: auto; }
    .welcome { margin: auto; max-width: 620px; text-align: center; }
    .welcome h2 { margin: 0 0 10px; font-size: clamp(26px, 5vw, 42px); letter-spacing: -.04em; }
    .welcome p { margin: 0 auto 24px; color: #9aa9bb; line-height: 1.6; }
    .suggestions { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
    .suggestion { color: #c9d7e8; background: #151e2a; border: 1px solid #2a3a4d; border-radius: 999px; padding: 9px 13px; cursor: pointer; font: inherit; font-size: 12px; }
    .suggestion:hover { background: #1b2b40; border-color: #4b78ac; }
    .message { display: flex; gap: 11px; max-width: 82%; align-items: flex-start; }
    .message.user { align-self: flex-end; flex-direction: row-reverse; }
    .avatar { flex: 0 0 28px; width: 28px; height: 28px; display: grid; place-items: center; border-radius: 9px; background: #26364b; color: #abc8f2; font-size: 12px; }
    .user .avatar { background: #3b5fa4; color: #fff; }
    .bubble { padding: 12px 14px; border: 1px solid #243242; border-radius: 15px; background: #141c26; white-space: pre-wrap; line-height: 1.55; font-size: 14px; overflow-wrap: anywhere; }
    .user .bubble { border-color: #3d5f99; background: #1b3155; }
    .composer { border: 1px solid #2e4055; border-radius: 16px; padding: 10px; background: #111923e8; box-shadow: 0 12px 38px #05070b80; }
    textarea { width: 100%; min-height: 54px; max-height: 180px; display: block; resize: none; border: 0; outline: 0; background: transparent; color: #eef4fb; padding: 3px 4px 10px; font: inherit; line-height: 1.45; }
    textarea::placeholder { color: #718096; }
    .composer-footer { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .hint { color: #718096; font-size: 11px; }
    .actions { display: flex; align-items: center; gap: 8px; }
    button { font: inherit; }
    #clear { color: #9aa9bb; background: transparent; border: 0; cursor: pointer; font-size: 12px; padding: 8px; }
    #send { min-width: 74px; border: 0; border-radius: 9px; padding: 9px 15px; color: #fff; background: #3478ed; cursor: pointer; font-weight: 600; }
    #send:hover:not(:disabled) { background: #4788f4; }
    #send:disabled { cursor: wait; opacity: .55; }
    .download { color: #b8d2ff; cursor: pointer; background: transparent; border: 0; padding: 0; font-size: inherit; }
    @media (max-width: 640px) { .shell { padding: 20px 14px 28px; } header { align-items: flex-start; } #status { max-width: 145px; } .message { max-width: 94%; } .hint { display: none; } }
  </style>
</head>
<body>
  <main class="shell">
    <header>
      <div class="brand"><div class="mark">✦</div><div><h1>Local AI Browser</h1><p class="subtitle">Private chat, powered by your local model</p></div></div>
      <div id="status">Checking local model…</div>
    </header>

    <section id="messages" aria-live="polite">
      <div class="welcome" id="welcome">
        <h2>How can I help?</h2>
        <p>Ask a question and get a response from the model running on this device. Your conversation stays local.</p>
        <div class="suggestions">
          <button class="suggestion">Explain a difficult idea simply</button>
          <button class="suggestion">Help me brainstorm a project</button>
          <button class="suggestion">Write a concise email</button>
        </div>
      </div>
    </section>

    <form class="composer" id="composer">
      <textarea id="prompt" rows="2" placeholder="Message your local model…" aria-label="Message"></textarea>
      <div class="composer-footer"><span class="hint">Enter to send · Shift+Enter for a new line</span><div class="actions"><button type="button" id="clear">Clear</button><button id="send" type="submit">Send</button></div></div>
    </form>
  </main>

  <script>
    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const prompt = document.getElementById('prompt');
    const send = document.getElementById('send');
    const status = document.getElementById('status');
    let session = null;
    let busy = false;

    function setStatus(text, type = '') { status.textContent = text; status.className = type; }
    function scrollToBottom() { messages.scrollTop = messages.scrollHeight; }
    function addMessage(text, role) {
      if (welcome) welcome.remove();
      const row = document.createElement('div'); row.className = `message ${role}`;
      const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = role === 'user' ? 'You' : '✦';
      const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
      row.append(avatar, bubble); messages.appendChild(row); scrollToBottom();
      return bubble;
    }
    async function ensureSession() {
      if (session) return session;
      session = await window.ai.languageModel.create({
        systemPrompt: 'You are a helpful, concise assistant. Answer clearly and accurately. This is a private local chat.'
      });
      return session;
    }
    async function sendMessage(text) {
      if (!text || busy) return;
      busy = true; send.disabled = true; prompt.disabled = true;
      addMessage(text, 'user');
      const answer = addMessage('', 'assistant');
      try {
        const activeSession = await ensureSession();
        for await (const chunk of activeSession.promptStreaming(text)) { answer.textContent += chunk; scrollToBottom(); }
      } catch (error) {
        answer.textContent = `Unable to respond: ${error.message || error}`;
        setStatus('Model unavailable', 'error');
      } finally { busy = false; send.disabled = false; prompt.disabled = false; prompt.focus(); }
    }
    document.getElementById('composer').addEventListener('submit', (event) => { event.preventDefault(); const text = prompt.value.trim(); prompt.value = ''; sendMessage(text); });
    prompt.addEventListener('keydown', (event) => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); document.getElementById('composer').requestSubmit(); } });
    document.getElementById('clear').onclick = async () => { if (session) { await session.destroy(); session = null; } messages.innerHTML = ''; messages.appendChild(welcome || (() => { const d = document.createElement('div'); d.className = 'welcome'; d.innerHTML = '<h2>How can I help?</h2><p>Ask a question and get a response from the model running on this device.</p>'; return d; })()); };
    document.querySelectorAll('.suggestion').forEach((button) => { button.onclick = () => { prompt.value = button.textContent; prompt.focus(); }; });

    async function init() {
      if (!window.ai) { setStatus('Local AI unavailable', 'error'); prompt.disabled = true; send.disabled = true; return; }
      try {
        const availability = await window.ai.availability({ tier: 'default' });
        if (availability.state === 'available') { setStatus(`${availability.model} · Ready`, 'ready'); return; }
        if (availability.state === 'downloadable') {
          setStatus('Preparing local model…');
          await window.ai.download({ tier: 'default' }, (progress) => { if (progress.total) setStatus(`Downloading ${Math.round(progress.completed / progress.total * 100)}%`); });
          setStatus(`${availability.model} · Ready`, 'ready'); return;
        }
        setStatus(availability.reason || `Model ${availability.state}`, 'error');
      } catch (error) { setStatus('Start Ollama to chat locally', 'error'); }
    }
    init();
  </script>
</body>
</html>
